---
# SSL Certificate Configuration (用于编译签名)
cert_dir: "{{ playbook_dir }}/script/ssl"
cert_file_filename: "FullSSL.crt"
codesign_cert_filename: "FullSSL.crt"
codesign_key_filename: "SSL.key"

# Enable signature generation
generate_signatures: true

# set desired site name
site_name: "南阳理工学院 PXE 启动服务"
boot_domain: "pxe.nyist.edu.cn"

# site_name: mysitename.com

# set desired boot domain
# boot_domain: boot.mysitename.com

# set boot version
# boot_version: "3.x"

# bootloader_tftp_enabled: false
# bootloader_https_enabled: true
# bootloader_http_enabled: true

# set release overrides from standard netboot.xyz defaults
release_overrides:
  ubuntu:
    mirror: "https://mirror.nyist.edu.cn/ubuntu"
    archive_mirror: "https://mirror.nyist.edu.cn/ubuntu"
  
  fedora:
    mirror: "https://mirror.nyist.edu.cn/fedora"
  
  almalinux:
    mirror: "https://mirror.nyist.edu.cn/almalinux"
  
  alpine:
    mirror: "https://mirror.nyist.edu.cn/alpine"
  
  archlinux:
    mirror: "https://mirror.nyist.edu.cn/archlinux"
  
  centos:
    mirror: "https://mirror.nyist.edu.cn/centos"
  
  debian:
    mirror: "https://mirror.nyist.edu.cn/debian"
  
  rockylinux:
    mirror: "https://mirror.nyist.edu.cn/rocky"
  
  opensuse:
    mirror: "https://mirror.nyist.edu.cn/opensuse"

# set utilitiesefi_overrides from standard netboot.xyz defaults for EFI utilities
# utilitiesefi_overrides:
#  supergrub:
#    enabled: false

# set utilities_overrides from standard netboot.xyz defaults for PC BIOS utilities
# utilitiespcbios64_overrides:
#  supergrub:
#    enabled: false

early_menu_enabled: false
early_menu_contents: |
   ### early menu overrides
   ### used to set early ipxe options such as custom console & logo
   # console --x 1024 --y 768
   # console --picture https://boot.netboot.xyz/logo.png
