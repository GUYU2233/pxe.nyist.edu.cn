name: Build netboot.xyz

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible syslinux isolinux xorriso
    
    - name: Build netboot.xyz
      run: |
        chmod +x script/build_and_package.sh
        sudo ./script/build_and_package.sh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: netbootxyz-deploy
        path: /tmp/netbootxyz-deploy-*.tar.gz
        retention-days: 30
